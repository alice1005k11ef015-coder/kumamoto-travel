<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熊本九州之旅 2027</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SortableJS (拖曳排序) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kuma: {
              black: '#1A1A1A',
              red: '#E60012',
              white: '#FFFFFF',
              bg: '#EAF4EB',
              card: '#FFFFFF',
              accent: '#333333'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #EAF4EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-gray-800 antialiased pb-20 selection:bg-red-500 selection:text-white">

<div id="app" class="max-w-md mx-auto min-h-screen bg-kuma-bg relative shadow-2xl overflow-hidden">

  <!-- 頁首區域 Banner -->
  <div class="relative w-full h-[250px] bg-gray-200 overflow-hidden">
    <img src="Gemini_Generated_Image_zhncefzhncefzhnc.jpg" alt="Banner" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/20"></div>
    <div class="absolute top-4 left-4 text-white font-bold text-lg tracking-wider drop-shadow-md">
      熊本‧九州之旅 2027 🇯🇵
    </div>

    <div class="absolute bottom-6 right-4 flex space-x-2 bg-black/60 backdrop-blur-md p-1.5 rounded-full border border-white/20 shadow-lg">
      <button v-for="tab in tabs" :key="tab.id" @click="currentTab = tab.id"
              :class="['px-3 py-1.5 rounded-full text-xs font-medium flex items-center space-x-1.5 transition-all duration-300', 
                       currentTab === tab.id ? 'bg-kuma-red text-white shadow-md scale-105' : 'text-gray-200 hover:text-white']">
        <i :class="tab.icon"></i>
